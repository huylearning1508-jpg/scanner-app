# Tự động deploy toàn bộ repo (đây là 1 project web độc lập, gốc repo = gốc site)
# lên GitHub Pages mỗi khi push vào nhánh main.
#
# Thiết lập 1 lần trên GitHub (không cần làm gì thêm sau đó):
#   Repo → Settings → Pages → "Build and deployment" → Source: "GitHub Actions"
#
# Sau khi workflow chạy xong, trang sẽ có tại:
#   https://<username>.github.io/<ten-repo>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm "Run workflow" thủ công trên tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload toàn bộ repo làm Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
